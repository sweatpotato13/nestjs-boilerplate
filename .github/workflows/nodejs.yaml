# .github/workflows/nodejs.yml
name: Node CI

on: [push, pull_request] # Run on Push and Pull Requests

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 22.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm build and typecheck
      working-directory: .
      run: |
        pnpm install
        pnpm build
        pnpm typecheck
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 22.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm test
      working-directory: .
      run: |
        pnpm install
        npx prisma generate
        pnpm test
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 22.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm lint
      working-directory: .
      run: |
        pnpm install
        npx prisma generate
        pnpm lint
    - name: Check public/swagger.json is up to date
      working-directory: .
      run: |
        cp public/swagger.json "$RUNNER_TEMP/swagger.committed.json"
        pnpm swagger
        node -e '
          const fs = require("fs");
          const sort = v => Array.isArray(v) ? v.map(sort)
            : v && typeof v === "object"
              ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])]))
              : v;
          const read = f => JSON.stringify(sort(JSON.parse(fs.readFileSync(f, "utf8"))));
          if (read(process.argv[1]) !== read("public/swagger.json")) {
            console.error("public/swagger.json is stale. Run `pnpm swagger` and commit the result.");
            process.exit(1);
          }
        ' "$RUNNER_TEMP/swagger.committed.json"
