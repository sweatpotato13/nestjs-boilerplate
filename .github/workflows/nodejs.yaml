# .github/workflows/nodejs.yml
name: Node CI

on: [push, pull_request] # Run on Push and Pull Requests

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.14.1, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm build and typecheck
      working-directory: .
      run: |
        pnpm install --frozen-lockfile
        pnpm prisma:generate
        pnpm build
        pnpm typecheck
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
    strategy:
      matrix:
        node-version: [24.14.1, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm test
      working-directory: .
      run: |
        pnpm install --frozen-lockfile
        pnpm prisma:generate
        pnpm exec prisma migrate deploy
        pnpm test
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.14.1, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6 # version from packageManager in package.json
    - name: pnpm lint
      working-directory: .
      run: |
        pnpm install --frozen-lockfile
        pnpm prisma:generate
        pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
    - name: Check public/swagger.json is up to date
      working-directory: .
      run: |
        cp public/swagger.json "$RUNNER_TEMP/swagger.committed.json"
        pnpm swagger
        node -e '
          const fs = require("fs");
          const sort = v => Array.isArray(v) ? v.map(sort)
            : v && typeof v === "object"
              ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])]))
              : v;
          const read = f => JSON.stringify(sort(JSON.parse(fs.readFileSync(f, "utf8"))));
          if (read(process.argv[1]) !== read("public/swagger.json")) {
            console.error("public/swagger.json is stale. Run `pnpm swagger` and commit the result.");
            process.exit(1);
          }
        ' "$RUNNER_TEMP/swagger.committed.json"
