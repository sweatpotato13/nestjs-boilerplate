name: Node CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
    strategy:
      matrix:
        node-version: ['^22.23.4', '^24.22.1', '^26.12.1']
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies and generate Prisma client
      run: |
        pnpm install --frozen-lockfile
        pnpm prisma:generate
    - name: Build and typecheck
      run: |
        pnpm build
        pnpm typecheck
    - name: Test
      run: |
        pnpm exec prisma migrate deploy
        pnpm test
    - name: Lint
      if: startsWith(matrix.node-version, '^26.')
      run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
    - name: Check public/swagger.json is up to date
      if: startsWith(matrix.node-version, '^26.')
      run: |
        cp public/swagger.json "$RUNNER_TEMP/swagger.committed.json"
        pnpm swagger
        node -e '
          const fs = require("fs");
          const sort = v => Array.isArray(v) ? v.map(sort)
            : v && typeof v === "object"
              ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])]))
              : v;
          const read = f => JSON.stringify(sort(JSON.parse(fs.readFileSync(f, "utf8"))));
          if (read(process.argv[1]) !== read("public/swagger.json")) {
            console.error("public/swagger.json is stale. Run `pnpm swagger` and commit the result.");
            process.exit(1);
          }
        ' "$RUNNER_TEMP/swagger.committed.json"
